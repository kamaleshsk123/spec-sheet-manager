
<div class="bg-white rounded-xl shadow-sm border border-gray-200 mb-8">
  <div class="p-6 border-b border-gray-100">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Specification Details</h2>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div>
        <label for="specTitle" class="block text-sm font-medium text-gray-700 mb-2">Spec Sheet Title</label>
        <input
          type="text"
          id="specTitle"
          [(ngModel)]="specTitle"
          name="specTitle"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400"
          placeholder="Enter specification title..."
        />
      </div>
      <div>
        <label for="specVersion" class="block text-sm font-medium text-gray-700 mb-2">Version</label>
        <input
          type="text"
          id="specVersion"
          [(ngModel)]="specVersion"
          name="specVersion"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400"
          placeholder="1.0.0"
        />
      </div>
    </div>
    <div class="mt-6">
      <label for="specDescription" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
      <textarea
        id="specDescription"
        [(ngModel)]="specDescription"
        name="specDescription"
        rows="3"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400 resize-none"
        placeholder="Describe your protocol buffer specification..."
      ></textarea>
    </div>
    <div class="mt-6">
      <label for="specTags" class="block text-sm font-medium text-gray-700 mb-2">Tags (comma-separated)</label>
      <input
        type="text"
        id="specTags"
        [(ngModel)]="specTags"
        name="specTags"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400"
        placeholder="api, user, service, v1"
      />
    </div>

    <!-- Team Selection for New Specs -->
    <div *ngIf="!currentSpecId && myTeams.length > 0" class="mt-6">
      <label for="teamSelect" class="block text-sm font-medium text-gray-700 mb-2">Save to</label>
      <select
        id="teamSelect"
        [(ngModel)]="selectedTeamId"
        name="teamSelect"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 bg-white"
      >
        <option value="personal">Personal Workspace</option>
        <option *ngFor="let team of myTeams" [value]="team.id">{{ team.name }}</option>
      </select>
    </div>
  </div>
</div>
