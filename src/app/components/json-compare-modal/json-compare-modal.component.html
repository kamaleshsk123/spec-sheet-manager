<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4">
    <div class="flex items-center justify-between p-4 border-b">
      <h3 class="text-lg font-semibold">Compare JSON Schemas</h3>
      <button (click)="close.emit()" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div class="p-4 grid grid-cols-2 gap-4">
      <div>
        <h4 class="text-md font-semibold mb-2">Old Version</h4>
        <pre class="bg-gray-100 p-4 rounded-lg text-sm overflow-auto">{{ oldSpecJson }}</pre>
      </div>
      <div>
        <h4 class="text-md font-semibold mb-2">New Version</h4>
        <pre class="bg-gray-100 p-4 rounded-lg text-sm overflow-auto">{{ newSpecJson }}</pre>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 p-4 border-t">
      <button (click)="close.emit()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
        Close
      </button>
    </div>
  </div>
</div>
