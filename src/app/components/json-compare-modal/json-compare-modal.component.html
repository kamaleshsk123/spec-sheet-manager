<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" (click)="onClose()">
  <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="bg-gray-50 px-6 py-4 border-b">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold text-gray-900">Compare JSON Specs</h2>
        <button (click)="onClose()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-md transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <h3 class="text-lg font-medium text-gray-800 mb-2">Old Version</h3>
          <pre class="bg-gray-100 p-4 rounded-md text-sm overflow-auto">{{ specData?.oldSpec | json }}</pre>
        </div>
        <div>
          <h3 class="text-lg font-medium text-gray-800 mb-2">New Version</h3>
          <pre class="bg-gray-100 p-4 rounded-md text-sm overflow-auto">{{ specData?.newSpec | json }}</pre>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="bg-gray-50 px-6 py-4 border-t flex justify-end">
      <button (click)="onClose()" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-50">Close</button>
    </div>
  </div>
</div>
