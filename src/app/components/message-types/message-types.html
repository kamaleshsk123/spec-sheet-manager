<app-message-envelope-list [showNewButton]="false" [showDeleteButton]="false" (envelopeSelected)="onEnvelopeSelected($event)"></app-message-envelope-list>

<div class="flex flex-row gap-8 mt-8">
  <!-- Card 1: Message Types List -->
  <div class="w-1/2 bg-white rounded-2xl shadow-md border border-gray-200 flex flex-col overflow-hidden" style="height: 70vh;">
    <!-- Header -->
    <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50 flex-shrink-0">
      <h3 class="text-xl font-semibold pl-4 text-gray-800 flex items-center gap-2">
        
        Message Types
      </h3>
      <button
  (click)="openAddMessageModal()"
  class="group flex items-center justify-center gap-0 bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-2 py-2 transition-all duration-300 shadow-sm hover:shadow-md overflow-hidden"
  title="Add New Message Type"
>
  <!-- Plus Icon -->
  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
  </svg>

  <!-- Hidden Text (appears on hover) -->
  <span
    class="max-w-0 opacity-0 group-hover:max-w-xs group-hover:opacity-100 transition-all duration-300 ease-in-out whitespace-nowrap overflow-hidden"
  >
    Add Message
  </span>
</button>

    </div>
  
    <!-- List -->
    <ul class="flex-grow overflow-y-auto p-4 space-y-2 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100">
      <li *ngFor="let msg of messageTypes">
        <button
          (click)="selectMessage(msg)"
          class="w-full text-left px-4 py-3 rounded-lg transition-all duration-200 flex items-center justify-between group"
          [ngClass]="{
            'bg-blue-100 text-blue-700 shadow-sm': msg === selectedMessage,
            'hover:bg-gray-100 text-gray-800': msg !== selectedMessage
          }"
        >
          <span class="font-medium truncate">{{ msg.name }}</span>
          <svg
            *ngIf="msg === selectedMessage"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-blue-600 opacity-80 group-hover:opacity-100"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </button>
      </li>
    </ul>
  
    <!-- Footer (Optional Placeholder) -->
    <div class="p-3 border-t border-gray-200 bg-gray-50 text-sm text-gray-500 text-center">
      {{ messageTypes.length || 0 }} message types
    </div>
  </div>
  

  <!-- Card 2: Details and Payload -->
  <div class="w-1/2 bg-white rounded-xl mb-5 shadow-sm border border-gray-200 flex flex-col" style="height: 70vh;">
    <div *ngIf="!selectedMessage" class="h-full flex items-center justify-center text-center p-8">
      <div class="border-2 border-dashed border-gray-300 rounded-lg p-12">
        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 16l2.879-2.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="mt-4 text-xl font-semibold text-gray-700">Select a Message</h3>
        <p class="mt-2 text-gray-500">Select a message type from the list to view its combined payload.</p>
      </div>
    </div>

    <div *ngIf="selectedMessage" class="flex-grow flex flex-col h-full">
      <div class="p-4 border-b border-gray-200 flex justify-between items-center flex-shrink-0">
        <h3 class="text-lg font-semibold text-gray-900">{{ selectedMessage.name }}</h3>
        <button (click)="editMessage(selectedMessage)" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:ring-2 focus:ring-blue-500">
          Edit Message
        </button>
      </div>

      <div class="p-4 flex-grow flex flex-col">
        <h4 class="text-md font-semibold text-gray-800 mb-2">Combined Payload</h4>
        <div class="bg-gray-900 text-gray-100 rounded-lg p-4 flex-grow overflow-y-auto">
          <pre class="text-sm whitespace-pre-wrap"><code>{{ combinedJson | json }}</code></pre>
        </div>
      </div>
    </div>
  </div>
</div>

<app-add-message-modal *ngIf="showAddMessageModal" (close)="closeAddMessageModal()" (save)="handleSaveMessage($event)"></app-add-message-modal>
