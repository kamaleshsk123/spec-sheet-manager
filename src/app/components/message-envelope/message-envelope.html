<app-message-envelope-list (envelopeSelected)="onEnvelopeSelected($event)"></app-message-envelope-list>

<div *ngIf="selectedMessageEnvelope" class="mt-8">
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Message Title</h3>
    <input
      type="text"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400"
      placeholder="Enter message..."
      [(ngModel)]="selectedMessageEnvelope.title"
    />

    <div class="mt-6">
      <label for="specDescription" class="block text-sm font-medium text-gray-700 mb-2"
        >Description</label
      >
      <textarea
        rows="3"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400 resize-none"
        placeholder="Describe your protocol buffer specification..."
        [(ngModel)]="selectedMessageEnvelope.description"
      ></textarea>
    </div>
  </div>

  <div class="mt-8">
    <app-definition-details
      [(protoFile)]="protoFile"
      [(jsonSchema)]="jsonSchema"
      [(jsonFields)]="jsonFields"
      [(toggleValue)]="toggleValue"
      [(code)]="code"
      [editorOptions]="editorOptions"
    ></app-definition-details>
  </div>

  <div class="flex justify-end mt-6">
      <button
          (click)="saveMessageEnvelope()"
          class="px-6 py-3 border border-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-50 focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
          Save
      </button>
  </div>
</div>
