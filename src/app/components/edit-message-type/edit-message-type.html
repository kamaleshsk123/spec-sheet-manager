<div *ngIf="message">
  <div class="flex justify-between">
    <h2>Editing Message: {{ message.name }}</h2>
    <!-- <button (click)="onDone()">Done</button> -->
    <button
      type="button"
      (click)="onDone()"
      class="inline-flex items-center px-3 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white text-sm font-medium  rounded-lg hover:from-blue-600 hover:to-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200 shadow-sm"
    >
      <svg class="mr-2"
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#fff"
      >
        <path d="M400-240 160-480l240-240 56 58-142 142h486v80H314l142 142-56 58Z" />
      </svg>
      Back
    </button>
  </div>
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Message Title</h3>
    <input
      type="text"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400"
      placeholder="Enter message..."
      [(ngModel)]="message.name"
    />

    <div class="mt-6">
      <label for="specDescription" class="block text-sm font-medium text-gray-700 mb-2"
        >Payload Definition</label
      >
      <textarea
        rows="3"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 placeholder-gray-400 resize-none"
        placeholder="Describe the Payload Definition..."
        [(ngModel)]="message.payloadDefinition"
      ></textarea>
    </div>
  </div>

  <div class="mt-8">
    <app-definition-details
      [(protoFile)]="protoFile"
      [(jsonSchema)]="jsonSchema"
      [(jsonFields)]="jsonFields"
      [(toggleValue)]="toggleValue"
      [(code)]="code"
      [editorOptions]="editorOptions"
    ></app-definition-details>
  </div>
</div>
