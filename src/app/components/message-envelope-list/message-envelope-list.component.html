<div class="bg-white rounded-2xl shadow-md border border-gray-200 p-6 flex flex-col">
  <!-- Header -->
  <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-4">
    <h3 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7m-2 0H5m14 0l-7-4-7 4" />
      </svg>
      All Message Envelopes
    </h3>

    <button
      *ngIf="showNewButton"
      (click)="newMessageEnvelope()"
      class="group flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg px-4 py-2 shadow-sm hover:shadow-md transition-all duration-300"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-200 group-hover:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      <span>Add Envelope</span>
    </button>
  </div>

  <!-- Envelope List -->
  <ul class="flex-grow overflow-y-auto space-y-2 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100">
    <li
      *ngFor="let envelope of messageEnvelopes"
      (click)="selectMessageEnvelope(envelope)"
      [ngClass]="{
        'bg-blue-50 border-blue-400 ring-1 ring-blue-200 shadow-sm': selectedMessageEnvelope?.id === envelope.id,
        'hover:bg-gray-50 border-transparent': selectedMessageEnvelope?.id !== envelope.id
      }"
      class="p-4 rounded-lg border cursor-pointer flex justify-between items-center transition-all duration-200 group"
    >
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 group-hover:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7m-2 0H5m14 0l-7-4-7 4" />
        </svg>
        <span class="font-medium text-gray-800 truncate group-hover:text-blue-700 transition-colors">
          {{ envelope.title }}
        </span>
      </div>

      <button
        *ngIf="showDeleteButton"
        (click)="deleteMessageEnvelope(envelope.id); $event.stopPropagation()"
        class="h-8 w-8 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-all duration-200"
        title="Delete Envelope"
      >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
        />
      </svg>
      </button>
    </li>
  </ul>

  <!-- Footer -->
  <div class="pt-3 mt-3 border-t border-gray-200 text-sm text-gray-500 text-center">
    {{ messageEnvelopes.length || 0 }} total envelopes
  </div>
</div>
